[pytest]
asyncio_mode = auto
# 默认跳过集成测试（含真实上游、build 脚本、astropy 重计算），日常开发 <30s 跑完。
# 全量运行：pytest -m "" 或 pytest --override-ini="addopts="
markers =
    integration: 集成测试 — 真实上游（ASTROMETRY_SERVICE_URL）、build/enrich 脚本（subprocess）、或 astropy WCS 重计算（单测 >1s）。默认跳过；运行 `pytest -m ""` 跑全量。
addopts = -m "not integration"